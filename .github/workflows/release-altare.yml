name: Release Altare Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.altare'
      - 'docker/rootfs/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-altare.yml'

env:
  DOCKERHUB_IMAGE: synapsr/hovod-altare

jobs:
  build-and-push:
    name: Build and publish Altare image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Altare image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.altare
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=altare-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=hovod-altare
          cache-to: type=gha,mode=max,scope=hovod-altare
